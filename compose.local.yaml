name: jakal-local

services:
  app:
    build: .
    image: jakal-workspace:local-preview
    init: true
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 3g
    cpus: 2
    environment:
      JAKAL_ENV: development
      JAKAL_HOST: 0.0.0.0
      JAKAL_PORT: 8000
      JAKAL_DATA_DIR: /var/lib/jakal
      JAKAL_TRUSTED_PROXIES: 127.0.0.1,${JAKAL_LOCAL_PROXY_ADDRESS:-172.30.89.2}
      JAKAL_STDIO_CONFIG: "0"
    volumes:
      - documents:/var/lib/jakal
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=268435456,uid=10001,gid=10001,mode=1770
    networks:
      backend:
        ipv4_address: ${JAKAL_LOCAL_APP_ADDRESS:-172.30.89.3}
    stop_grace_period: 30s
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}

  gateway:
    image: caddy:2-alpine
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${JAKAL_LOCAL_PORT:-18988}:8080"
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data:rw,nosuid,size=16777216
      - /config:rw,nosuid,size=16777216
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    networks:
      edge: {}
      backend:
        ipv4_address: ${JAKAL_LOCAL_PROXY_ADDRESS:-172.30.89.2}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/api/health]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}

networks:
  edge: {}
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${JAKAL_LOCAL_SUBNET:-172.30.89.0/29}

volumes:
  documents: {}
