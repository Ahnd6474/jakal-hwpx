[tox]
env_list = py311, py312, py313, py314, lint, pkg, release
skip_missing_interpreters = true
isolated_build = true

[testenv]
description = Run the pytest suite with {basepython}
extras = test
setenv =
    TMP = {toxworkdir}{/}.tmp
    TEMP = {toxworkdir}{/}.tmp
    TMPDIR = {toxworkdir}{/}.tmp
    PYTEST_ADDOPTS = -o cache_dir={toxworkdir}{/}.pytest_cache
commands = pytest -q {posargs}

[testenv:lint]
description = Run lint and the staged type-checking boundary
extras = lint
commands =
    ruff check src tests
    mypy --follow-imports=skip --disable-error-code=import-untyped \
        src/jakal_hwpx/_hancom_models.py \
        src/jakal_hwpx/_hancom_from_hwp.py \
        src/jakal_hwpx/_hancom_from_hwpx.py \
        src/jakal_hwpx/_hancom_styles.py \
        src/jakal_hwpx/_hancom_to_hwp.py \
        src/jakal_hwpx/_hancom_to_hwpx.py \
        src/jakal_hwpx/_hwp_constants.py \
        src/jakal_hwpx/_hwp_graphic_payloads.py \
        src/jakal_hwpx/_hwp_object_payloads.py \
        src/jakal_hwpx/_hwp_page_payloads.py \
        src/jakal_hwpx/_hwp_payload_codecs.py \
        src/jakal_hwpx/_hwp_record_tree.py \
        src/jakal_hwpx/_hwp_table_objects.py \
        src/jakal_hwpx/_hwpx2py_authoring.py \
        src/jakal_hwpx/_hwpx2py_macro.py \
        src/jakal_hwpx/_hwpx2py_semantic.py \
        src/jakal_hwpx/_hwpx_archive.py \
        src/jakal_hwpx/_hwpx_chart_xml.py \
        src/jakal_hwpx/_hwpx_common.py \
        src/jakal_hwpx/_hwpx_element_helpers.py \
        src/jakal_hwpx/_hwpx_factory.py \
        src/jakal_hwpx/_hwpx_validation.py \
        src/jakal_hwpx/exceptions.py \
        src/jakal_hwpx/namespaces.py \
        src/jakal_hwpx/parts.py \
        src/jakal_hwpx/xmlnode.py

[testenv:pkg]
description = Build release artifacts and verify PyPI metadata
extras = release
setenv =
    TMP = {toxworkdir}{/}.tmp
    TEMP = {toxworkdir}{/}.tmp
    TMPDIR = {toxworkdir}{/}.tmp
commands =
    python -c "from pathlib import Path; import shutil; dist = Path('dist'); shutil.rmtree(dist, ignore_errors=True); dist.mkdir(exist_ok=True)"
    python -m build --sdist --wheel --outdir dist --no-isolation
    python -m twine check dist/*
    python -c "from pathlib import Path; from scripts.check_release import ensure_required_entries, read_versions; warnings = ensure_required_entries(sorted(Path('dist').iterdir()), read_versions()); assert not warnings, warnings"

[testenv:release]
description = Run the CI-compatible or full release gate based on JAKAL_RELEASE_PROFILE
extras = release
passenv = JAKAL_RELEASE_PROFILE
setenv =
    TMP = {toxworkdir}{/}.tmp
    TEMP = {toxworkdir}{/}.tmp
    TMPDIR = {toxworkdir}{/}.tmp
commands = python scripts/check_release.py --profile {env:JAKAL_RELEASE_PROFILE:ci}
