name: jakal-workspace

services:
  app:
    build: .
    image: jakal-workspace:local
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: ${JAKAL_MEMORY_LIMIT:-3g}
    cpus: 2
    environment:
      JAKAL_ENV: production
      JAKAL_HOST: 0.0.0.0
      JAKAL_PORT: 8000
      JAKAL_DATA_DIR: /var/lib/jakal
      JAKAL_PUBLIC_ORIGIN: https://${JAKAL_DOMAIN:?Set JAKAL_DOMAIN to the dedicated public hostname}
      JAKAL_TRUSTED_PROXIES: 127.0.0.1,${JAKAL_PROXY_ADDRESS:-172.30.88.2}
    volumes:
      - documents:/var/lib/jakal
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=268435456,uid=10001,gid=10001,mode=1770
    networks: [backend]
    stop_grace_period: 30s
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      JAKAL_DOMAIN: ${JAKAL_DOMAIN:?Set JAKAL_DOMAIN to the dedicated public hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - gateway-config:/config
    networks:
      public: {}
      backend:
        ipv4_address: ${JAKAL_PROXY_ADDRESS:-172.30.88.2}
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}

networks:
  public: {}
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${JAKAL_PROXY_SUBNET:-172.30.88.0/29}

volumes:
  documents: {}
  certificates: {}
  gateway-config: {}
