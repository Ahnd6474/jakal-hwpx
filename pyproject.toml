[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jakal-hwpx"
version = "1.0"

description = "Round-trip safe HWPX reader/editor/writer for Python"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
authors = [{ name = "Ahnd6474" }]
dependencies = ["lxml>=5.0.0,<7", "olefile>=0.47,<1"]
keywords = ["hwpx", "hancom", "document", "xml", "library"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Editors :: Word Processors",
]

[project.urls]
Homepage = "https://github.com/Ahnd6474/jakal-hwpx"
Source = "https://github.com/Ahnd6474/jakal-hwpx"
Issues = "https://github.com/Ahnd6474/jakal-hwpx/issues"
Documentation = "https://github.com/Ahnd6474/jakal-hwpx#readme"
Releases = "https://github.com/Ahnd6474/jakal-hwpx/releases"

[project.scripts]
hwp2py = "jakal_hwpx.hwp2py:main"
hwpx2py = "jakal_hwpx.hwpx2py:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.18,<2",
  "pytest>=8.0",
  "ruff>=0.14,<0.15",
  "setuptools>=77",
  "tox>=4.0",
  "twine>=5.0",
]
lint = ["mypy>=1.18,<2", "ruff>=0.14,<0.15"]
release = ["build>=1.2", "pytest>=8.0", "setuptools>=77", "twine>=5.0"]
test = ["pytest>=8.0"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "psutil>=5.9,<8", "Pillow>=13.0,<14", "pypdfium2>=5.14,<6", "mcp>=2.3,<3"]
web-test = ["httpx>=0.27,<1", "pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jakal_hwpx = ["py.typed", "bundled_hwp_profile/*.hwp", "bundled_hwp_profile/profile.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/_tmp_pytest"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
