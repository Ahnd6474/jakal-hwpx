name: Build application packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e '.[web,web-test,release]'
      - run: python scripts/check_private_artifacts.py
      - run: npm ci
        working-directory: web
      - run: python scripts/build_desktop.py
      - run: python -c "from pathlib import Path; import subprocess,sys; archive,=Path('dist').glob('Jakal-Workspace-*-windows-x64.zip'); subprocess.run([sys.executable,'scripts/check_desktop.py',str(archive)],check=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: Jakal-Windows-x64
          path: |
            dist/Jakal-Workspace-*-windows-x64.zip
            dist/Jakal-Workspace-*-windows-x64.zip.sha256

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e '.[web,web-test,release]'
      - run: python scripts/check_private_artifacts.py
      - run: npm ci
        working-directory: web
      - run: python scripts/build_server_bundle.py
      - run: |
          python -c "from pathlib import Path; from zipfile import ZipFile; archive,=Path('dist').glob('Jakal-Server-*.zip'); ZipFile(archive).extractall('.artifacts/package-check')"
          sh -n .artifacts/package-check/Jakal-Server/manage.sh
          docker build -t jakal-server:package .artifacts/package-check/Jakal-Server
          python scripts/check_container.py --image jakal-server:package
          python scripts/check_local.py .artifacts/package-check/Jakal-Server
      - uses: actions/upload-artifact@v4
        with:
          name: Jakal-Server
          path: |
            dist/Jakal-Server-*.zip
            dist/Jakal-Server-*.zip.sha256
