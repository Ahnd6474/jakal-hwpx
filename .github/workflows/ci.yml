---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Lint and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tox.ini

      - name: Install tox
        run: python -m pip install "tox>=4,<5"

      - name: Run Ruff and mypy
        run: python -m tox run -e lint

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            tox-env: py311
          - python-version: "3.12"
            tox-env: py312
          - python-version: "3.13"
            tox-env: py313
          - python-version: "3.14"
            tox-env: py314

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tox.ini

      - name: Install tox
        run: python -m pip install "tox>=4,<5"

      - name: Run portable test suite
        run: |
          mkdir -p build/test-results
          python -m tox run -e "${{ matrix.tox-env }}" -- \
            --junitxml="build/test-results/python-${{ matrix.python-version }}.xml"

      - name: Upload test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report-python-${{ matrix.python-version }}
          path: build/test-results/*.xml
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Build and smoke-test distributions
    needs: [quality, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tox.ini

      - name: Install tox
        run: python -m pip install "tox>=4,<5"

      - name: Build and validate distributions
        run: python -m tox run -e pkg

      - name: Smoke-test wheel installation
        run: |
          python -m venv build/smoke-wheel
          build/smoke-wheel/bin/python -m pip install dist/*.whl
          build/smoke-wheel/bin/python scripts/check_installed_package.py \
            --sample-path examples/samples/hwpx/math_template_2_formula_fixed.hwpx \
            --output-dir build/ci-smoke-wheel

      - name: Smoke-test sdist installation
        run: |
          python -m venv build/smoke-sdist
          build/smoke-sdist/bin/python -m pip install dist/*.tar.gz
          build/smoke-sdist/bin/python scripts/check_installed_package.py \
            --sample-path examples/samples/hwpx/math_template_2_formula_fixed.hwpx \
            --output-dir build/ci-smoke-sdist

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
