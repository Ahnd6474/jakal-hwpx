name: Web workspace

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e '.[web,web-test]'
      - run: python scripts/check_private_artifacts.py
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: python -m pytest web_tests -q
      - run: npm test
        working-directory: web

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check container build context
        run: python scripts/check_container_context.py
      - name: Validate HTTPS gateway
        run: >-
          docker run --rm --network none
          -e JAKAL_DOMAIN=editor.example.com
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build complete application image
        run: docker build -t jakal-workspace:test .
      - name: Verify isolated production container
        run: python scripts/check_container.py --image jakal-workspace:test
