name: Publish

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Target package index
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name }}-${{ github.ref }}-${{ inputs.repository || 'pypi' }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      dist-artifact-name: python-package-distributions
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade pip -e .[dev]

      - name: Run CI release gate
        run: python scripts/check_release.py --profile ci

      - name: Upload release gate report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-${{ github.sha }}
          path: build/release_gate/ci/
          if-no-files-found: ignore
          retention-days: 14

      - name: Smoke test wheel install
        run: |
          python -m venv .smoke-wheel
          .smoke-wheel/bin/python -m pip install --upgrade pip
          .smoke-wheel/bin/python -m pip install dist/*.whl
          .smoke-wheel/bin/python scripts/check_installed_package.py \
            --sample-path examples/samples/hwpx/math_template_2_formula_fixed.hwpx \
            --output-dir build/publish-smoke-wheel

      - name: Smoke test sdist install
        run: |
          python -m venv .smoke-sdist
          .smoke-sdist/bin/python -m pip install --upgrade pip
          .smoke-sdist/bin/python -m pip install dist/*.tar.gz
          .smoke-sdist/bin/python scripts/check_installed_package.py \
            --sample-path examples/samples/hwpx/math_template_2_formula_fixed.hwpx \
            --output-dir build/publish-smoke-sdist

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-testpypi:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/jakal-hwpx
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/jakal-hwpx
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
